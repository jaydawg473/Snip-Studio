name: macOS trial

on:
  push:
    branches: [feature/macos-trial]

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate package inputs
        run: |
          swift --version
          plutil -lint src/SnipStudio.Mac/Info.plist
          bash -n src/SnipStudio.Mac/package-trial.sh
      - name: Build release executable
        run: swift build --package-path src/SnipStudio.Mac --configuration release
